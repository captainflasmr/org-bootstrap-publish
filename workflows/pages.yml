name: Deploy org-bootstrap-publish site to Cloudflare Pages

# Copy this file to `.github/workflows/pages.yml` in your site's
# repository.  Adjust PATHS under `on.push.paths' to match your
# source tree.
#
# You also need to set CLOUDFLARE_API_TOKEN in your repository's
# Settings > Secrets and variables > Actions.

on:
  push:
    branches:
      - main
    paths:
      - 'README.org'
      - 'static/**'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare-pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Checkout org-bootstrap-publish
        uses: actions/checkout@v4
        with:
          repository: captainflasmr/org-bootstrap-publish
          path: .obp
          ref: main

      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox elpa-htmlize

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Build site
        run: |
          emacs --batch \
            -L "$GITHUB_WORKSPACE/.obp" \
            --eval "(package-initialize)" \
            -l org-bootstrap-publish \
            --eval "(progn
              (setq org-bootstrap-publish-source-file \"$GITHUB_WORKSPACE/README.org\")
              (setq org-bootstrap-publish-output-dir  \"$GITHUB_WORKSPACE/public\")
              (setq org-bootstrap-publish-site-title  \"Emacs Dwelling\")
              (setq org-bootstrap-publish-site-tagline \"Journeying through the Emacs rabbit hole\")
              (setq org-bootstrap-publish-site-url    \"https://emacs.dyerdwelling.family/\")
              (setq org-bootstrap-publish-site-path   \"/\")
              (setq org-bootstrap-publish-author      \"James Dyer\")
              (setq org-bootstrap-publish-menu-tags
                    '((\"2026\"         . \"2026\")
                      (\"org\"          . \"org\")
                      (\"ollama-buddy\" . \"ollama_buddy\")
                      (\"dired\"        . \"dired\")))
              (org-bootstrap-publish))"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages deploy ./public \
            --project-name=emacs-dyerdwelling \
            --commit-dirty=true \
            --branch=production